{{ define "main" }}
<section class="hero">
  <div class="hero-inner">
    <h1 class="hero-title">{{ .Site.Title | upper }}</h1>
    <p class="hero-tagline">{{ .Site.Params.tagline }}</p>
  </div>
</section>

<main id="main" class="index list">
  <div class="post-group">
    <ul>
      {{ range (where .Site.RegularPages "Section" "blog").ByDate.Reverse }}
        {{ partial "post-item.html" . }}
      {{ end }}
    </ul>
  </div>
</main>
{{ end }}
