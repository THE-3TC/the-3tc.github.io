{{ define "main" }}
<div id="main" class="index list section-blog">
  <h1 class="blog-page-title">{{ .Title }}</h1>

  {{ with .Content }}
    <div class="content">{{ . }}</div>
  {{ end }}

  <div class="post-group">
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-item.html" . }}
      {{ end }}
    </ul>
  </div>
</div>
{{ end }}
