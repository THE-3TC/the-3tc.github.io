{{ define "main" }}
<main id="main" class="index list">
  <h1 class="page-title">{{ .Title }}</h1>

  {{ with .Content }}
    <div class="page-intro">{{ . }}</div>
  {{ end }}

  <div class="post-group">
    <ul>
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "post-item.html" . }}
      {{ end }}
    </ul>
  </div>
</main>
{{ end }}
