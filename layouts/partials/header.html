<header id="header">
  <div class="site-header">
    <a class="site-title" href="/">{{ .Site.Title | upper }}</a>

    <nav class="top-nav" aria-label="Main navigation">
      {{ $current := . }}
      {{ range .Site.Params.nav }}
        <a href="{{ .url }}"{{ if hasPrefix $current.RelPermalink .url }} class="is-active" aria-current="page"{{ end }}>{{ .name }}</a>
      {{ end }}
    </nav>

    <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" aria-controls="mobile-menu" type="button">
      <span></span><span></span>
    </button>
  </div>

  <div class="mobile-menu-overlay" id="mobile-menu" aria-hidden="true">
    <nav class="mobile-menu-nav" aria-label="Mobile navigation">
      {{ range .Site.Params.nav }}
        <a href="{{ .url }}">{{ .name }}</a>
      {{ end }}
    </nav>
  </div>
</header>
